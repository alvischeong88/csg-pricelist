<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Availability — Agent View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --ink: #1b2430;
    --ink-soft: #5c6773;
    --paper: #f6f4ef;
    --line: #d9d4c8;
    --card: #ffffff;
    --accent: #c99a3a;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  header{ padding: 40px 28px 24px; max-width: 1100px; margin: 0 auto; }
  .eyebrow{ font-size: 13px; color: var(--ink-soft); margin: 0 0 6px; }
  h1{
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: clamp(26px, 4vw, 38px);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle{ color: var(--ink-soft); font-size: 15px; margin: 0 0 22px; }

  .top-bar{ display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  select#projectSelect{
    font-family: inherit; font-size: 15px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--card); color: var(--ink); max-width: 320px;
  }
  .who{ font-size: 13.5px; color: var(--ink-soft); margin-left: auto; display: flex; align-items: center; gap: 10px; }
  button.link-btn{
    background: none; border: none; color: var(--ink); font-family: inherit;
    font-size: 13.5px; cursor: pointer; text-decoration: underline; padding: 0;
  }

  .stats{ display: flex; gap: 28px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
  .stat{ display: flex; flex-direction: column; }
  .stat .num{ font-family: 'Newsreader', serif; font-size: 26px; color: var(--stat-color, var(--ink)); }
  .stat .label{ font-size: 13px; color: var(--ink-soft); }

  main{ max-width: 1100px; margin: 0 auto; padding: 0 28px 60px; }

  .empty-state{ border: 1px dashed var(--line); border-radius: 6px; padding: 40px 28px; text-align: center; color: var(--ink-soft); }

  .block-section{ margin-bottom: 8px; }
  .block-heading{ font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; margin: 0 0 16px; }
  .floor-section{ margin-bottom: 28px; }
  .floor-heading{
    font-family: 'Newsreader', serif; font-size: 17px; margin: 0 0 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); color: var(--ink);
  }
  .floor-heading .count{ font-size: 12.5px; color: var(--ink-soft); font-weight: 400; margin-left: 8px; }

  .grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .unit{
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
    padding: 14px 14px 12px; text-align: left; position: relative;
  }
  .unit .code{ font-family: 'Newsreader', serif; font-size: 19px; margin-bottom: 4px; }
  .unit .price{ font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .unit .status{ display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--stat-color); }
  .dot{ width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--stat-color); }
  .unit.is-set{ background: var(--stat-bg); border-color: var(--stat-color); }
  .unit .buyer{ display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Login screen */
  .login-wrap{
    max-width: 380px; margin: 90px auto; padding: 32px 32px 28px;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  }
  .login-wrap h2{ font-family: 'Newsreader', serif; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
  .login-wrap p{ color: var(--ink-soft); font-size: 13.5px; margin: 0 0 20px; }
  .field{ margin-bottom: 14px; }
  .field label{ display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
  .field input{
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px;
    font-family: inherit; font-size: 14.5px; background: var(--paper); color: var(--ink);
  }
  .field input:focus{ outline: none; border-color: var(--ink); }
  button.primary{
    width: 100%; background: var(--ink); color: var(--paper); border: none; padding: 11px 20px;
    border-radius: 4px; font-family: inherit; font-size: 14.5px; cursor: pointer; margin-top: 6px;
  }
  button.primary:hover{ background: #2c3948; }
  .error-text{ color: #a13d2f; font-size: 13px; margin: -6px 0 14px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
  // ==== Configure this before deploying (same values as the main board) ====
  const SUPABASE_URL = 'https://fianortepieapnoqhhgw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jVp8rSbVK7FLrE_inkhH6A_Y8FRPptx';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false }
  });

  const STATUS_META = {
    available:    { label: 'Available',                        color: '#2f6f4e', bg: '#eaf3ee' },
    booked:       { label: 'Booked',                            color: '#c9821f', bg: '#faf1e2' },
    spa:          { label: 'SPA Signed & Stamped',              color: '#2f6f8f', bg: '#e8f1f5' },
    devunit:      { label: 'Dev unit, Double Check With PIC',   color: '#7a4fa0', bg: '#f1eaf7' },
    unavailable:  { label: 'Not Available',                     color: '#5c5c5c', bg: '#ececec' }
  };
  const STATUS_ORDER = ['available', 'booked', 'spa', 'devunit', 'unavailable'];

  const app = document.getElementById('app');
  let currentUser = null;
  let projects = [];
  let currentProjectId = null;
  let currentUnits = [];

  function fmtPrice(n) {
    if (n === null || n === undefined || n === '') return null;
    const num = Number(n);
    if (isNaN(num)) return String(n);
    return 'RM ' + num.toLocaleString('en-MY');
  }
  function getFloor(code) {
    const parts = String(code).split('-');
    let raw = null;
    if (parts.length >= 3) raw = parts[parts.length - 2];
    else if (parts.length === 2) raw = parts[0];
    const num = parseInt(raw, 10);
    return isNaN(num) ? null : num;
  }
  function getBlock(code) {
    const parts = String(code).split('-');
    if (parts.length >= 3 && /^[A-Za-z]+$/.test(parts[0])) return parts[0].toUpperCase();
    return null;
  }

  function renderLogin(errorMsg) {
    app.innerHTML = `
      <div class="login-wrap">
        <h2>Agent sign in</h2>
        <p>Enter the login your admin set up for you to view current unit availability.</p>
        ${errorMsg ? `<p class="error-text">${errorMsg}</p>` : ''}
        <form id="loginForm">
          <div class="field"><label>Email</label><input id="loginEmail" type="email" required autofocus></div>
          <div class="field"><label>Password</label><input id="loginPassword" type="password" required></div>
          <button type="submit" class="primary">Sign in</button>
        </form>
      </div>
    `;
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        renderLogin('Incorrect email or password. Please try again.');
      } else {
        currentUser = data.user;
        renderBoard();
      }
    });
  }

  async function renderBoard() {
    app.innerHTML = `
      <header>
        <p class="eyebrow">Unit Availability — Agent View</p>
        <h1 id="pageTitle">Loading…</h1>
        <p class="subtitle">Read-only — for checking status only. Contact your admin or manager to make a booking.</p>
        <div class="top-bar">
          <select id="projectSelect"></select>
          <span class="who">${currentUser.email} <button class="link-btn" id="logoutBtn">Sign out</button></span>
        </div>
        <div class="stats" id="statsBar"></div>
      </header>
      <main><div id="content"></div></main>
    `;
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      currentUser = null;
      renderLogin();
    });
    document.getElementById('projectSelect').addEventListener('change', e => {
      currentProjectId = e.target.value;
      loadUnits();
    });
    await loadProjects();
  }

  async function loadProjects() {
    const { data, error } = await supabaseClient.from('projects').select('id,name').order('created_at', { ascending: true });
    const content = document.getElementById('content');
    if (error) {
      content.innerHTML = `<div class="empty-state"><p>Could not load projects (${error.message}).</p></div>`;
      return;
    }
    projects = data;
    if (projects.length > 0 && !currentProjectId) currentProjectId = projects[0].id;
    renderProjectSelect();
    if (currentProjectId) {
      await loadUnits();
    } else {
      document.getElementById('pageTitle').textContent = 'No projects yet';
      content.innerHTML = `<div class="empty-state"><p>No projects have been added yet.</p></div>`;
    }
  }

  function renderProjectSelect() {
    const select = document.getElementById('projectSelect');
    select.innerHTML = '';
    projects.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      if (String(p.id) === String(currentProjectId)) opt.selected = true;
      select.appendChild(opt);
    });
  }

  async function loadUnits() {
    const content = document.getElementById('content');
    content.innerHTML = '<p style="color:var(--ink-soft);">Loading units…</p>';
    const { data, error } = await supabaseClient
      .from('units')
      .select('*, purchasers(*)')
      .eq('project_id', currentProjectId)
      .order('code', { ascending: true });
    if (error) {
      content.innerHTML = `<div class="empty-state"><p>Could not load units (${error.message}).</p></div>`;
      return;
    }
    currentUnits = data;
    renderUnits();
  }

  function renderUnits() {
    const project = projects.find(p => String(p.id) === String(currentProjectId));
    document.getElementById('pageTitle').textContent = project ? project.name : 'No project yet';
    const content = document.getElementById('content');
    const statsBar = document.getElementById('statsBar');

    if (currentUnits.length === 0) {
      statsBar.innerHTML = '';
      content.innerHTML = `<div class="empty-state"><p>No units loaded for this project yet.</p></div>`;
      return;
    }

    const counts = {};
    STATUS_ORDER.forEach(s => counts[s] = 0);
    const blockMap = new Map();
    currentUnits.forEach(unit => {
      counts[unit.status] = (counts[unit.status] || 0) + 1;
      const block = getBlock(unit.code);
      const floor = getFloor(unit.code);
      if (!blockMap.has(block)) blockMap.set(block, new Map());
      const floorMap = blockMap.get(block);
      if (!floorMap.has(floor)) floorMap.set(floor, []);
      floorMap.get(floor).push(unit);
    });

    statsBar.innerHTML = STATUS_ORDER.map(key => `
      <div class="stat" style="--stat-color:${STATUS_META[key].color}">
        <span class="num">${counts[key] || 0}</span>
        <span class="label">${STATUS_META[key].label}</span>
      </div>
    `).join('');

    const blocks = Array.from(blockMap.keys()).sort((a, b) => {
      if (a === null) return 1;
      if (b === null) return -1;
      return a.localeCompare(b);
    });

    content.innerHTML = '';
    blocks.forEach(block => {
      const floorMap = blockMap.get(block);
      const blockWrap = document.createElement('div');
      blockWrap.className = 'block-section';
      if (block !== null) blockWrap.innerHTML = `<h1 class="block-heading">Block ${block}</h1>`;

      const floors = Array.from(floorMap.keys()).sort((a, b) => {
        if (a === null) return 1;
        if (b === null) return -1;
        return b - a;
      });

      floors.forEach(floor => {
        const entries = floorMap.get(floor).sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
        const section = document.createElement('div');
        section.className = 'floor-section';
        section.innerHTML = `<h2 class="floor-heading">${floor === null ? 'Other units' : 'Floor ' + floor}<span class="count">${entries.length} unit${entries.length === 1 ? '' : 's'}</span></h2>`;

        const grid = document.createElement('div');
        grid.className = 'grid';
        entries.forEach(unit => {
          const meta = STATUS_META[unit.status] || STATUS_META.available;
          const priceStr = fmtPrice(unit.price);
          const div = document.createElement('div');
          div.className = 'unit' + (unit.status !== 'available' ? ' is-set' : '');
          div.style.setProperty('--stat-color', meta.color);
          div.style.setProperty('--stat-bg', meta.bg);
          div.innerHTML = `
            <div class="code">${unit.code}</div>
            ${priceStr ? `<div class="price">${priceStr}</div>` : ''}
            <div class="status"><span class="dot"></span>${meta.label}</div>
            ${unit.purchasers && unit.purchasers.length ? `<span class="buyer">${unit.purchasers[0].name}</span>` : ''}
          `;
          grid.appendChild(div);
        });
        section.appendChild(grid);
        blockWrap.appendChild(section);
      });
      content.appendChild(blockWrap);
    });
  }

  // On load, check if already signed in (won't persist across refresh since
  // persistSession is off — agents sign in each visit, same trade-off as admin).
  supabaseClient.auth.getUser().then(({ data }) => {
    if (data && data.user) {
      currentUser = data.user;
      renderBoard();
    } else {
      renderLogin();
    }
  });
</script>

</body>
</html>
